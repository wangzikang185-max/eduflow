name: Verify V2
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0.34
        env: {MYSQL_ROOT_PASSWORD: acceptance-only, MYSQL_DATABASE: xuexu}
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -pacceptance-only" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven, cache-dependency-path: backend/pom.xml}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: corepack enable
      - run: cd frontend && pnpm install --frozen-lockfile && pnpm test && pnpm build
      - run: mvn -B -ntp -f backend/pom.xml package
      - run: |
          export DB_PASSWORD=acceptance-only
          export JWT_SECRET=$(openssl rand -hex 32)
          export V2_TEST_JWT_SECRET=$JWT_SECRET
          export ADMIN_PASSWORD=$(openssl rand -hex 16)
          export V2_TEST_PASSWORD=$ADMIN_PASSWORD
          export PORT=8086
          java -jar backend/target/xuexu-backend-2.0.0.jar > acceptance-server.log 2>&1 &
          for n in $(seq 1 60); do curl -fsS http://127.0.0.1:8086/health && break || sleep 1; done
          python tools/verify_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: acceptance-evidence, path: 'runtime/acceptance.json'}
